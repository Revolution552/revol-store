# Spring Application
spring.application.name=revol-store

# Server
server.port=5314

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/revol_store?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=developer_db
spring.datasource.password=@Root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS1mb3Itand0LWV4YW1wbGUtb25seS1wbGVhc2UtY2hhbmdl}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# TMDb API Configuration
tmdb.api-key=${TMDB_API_KEY:67f79bc1741cfc3f06bae2ade07b1f93}
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p
tmdb.rate-limit.max-requests-per-second=40

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.backend.revol_store=DEBUG
logging.level.org.hibernate.SQL=DEBUG
